[package]
name = "markitdown-quickstyle"
version = "0.1.0"
description = "MarkItDown QuickStyle - Markdown 转换小工具(GUI + 桌宠 + MCP)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
